<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OpenHackathonGPT — A fully local, multi-agent AI Hackathon Assistant powered by Ollama and LangGraph">
  <meta name="keywords" content="hackathon, AI, LLM, Ollama, multi-agent, problem discovery, pitch deck">
  <meta property="og:title" content="OpenHackathonGPT">
  <meta property="og:description" content="AI-powered hackathon assistant with 7 specialized agents">
  <title>OpenHackathonGPT — AI Hackathon Assistant</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/static/css/main.css?v=2">
  <link rel="stylesheet" href="/static/css/sidebar.css?v=2">
  <link rel="stylesheet" href="/static/css/chat.css?v=2">
  <link rel="stylesheet" href="/static/css/dashboard.css?v=2">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F8EF7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 22 12 17 22 22 12 2'/></svg>">
</head>
<body>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- App Shell -->
  <div id="app">

    <!-- Sidebar -->
    <nav id="sidebar" aria-label="Main navigation">
      <!-- Rendered by sidebar.js -->
    </nav>

    <!-- Main Content -->
    <div id="main-content">

      <!-- Top Bar -->
      <header style="
        padding: 12px 24px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        background: var(--bg-glass);
        backdrop-filter: blur(20px);
        position: relative;
        z-index: 10;
      ">
        <!-- Mobile menu -->
        <button class="btn btn-ghost btn-icon" id="mobile-sidebar-btn"
          style="display:none" aria-label="Open menu">☰</button>

        <!-- Breadcrumb -->
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:0.85rem;color:var(--text-muted)">OpenHackathonGPT</span>
          <span style="color:var(--border-color)">›</span>
          <span id="page-breadcrumb" style="font-size:0.85rem;font-weight:600;color:var(--text-primary)">Dashboard</span>
        </div>

        <!-- Top actions -->
        <div style="display:flex;align-items:center;gap:10px" id="top-actions">
          <!-- Model Selector -->
          <div id="model-selector-container"></div>

          <!-- Theme Toggle -->
          <button class="btn btn-ghost btn-icon" id="theme-toggle-btn" title="Toggle theme" aria-label="Toggle dark/light mode">
            <span id="theme-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
          </button>

          <!-- New Chat -->
          <button class="btn btn-primary" id="top-new-chat" onclick="window.navigateTo('chat',{newChat:true})">
            <span style="display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> New Chat</span>
          </button>
        </div>
      </header>

      <!-- Page Container -->
      <div id="page-container" class="page active">
        <!-- Pages rendered dynamically by app.js -->
        <div style="display:flex;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--text-muted)">
          <div class="spinner"></div>
          <span>Loading OpenHackathonGPT...</span>
        </div>
      </div>

      <!-- Status Bar -->
      <div id="status-bar-container"></div>

    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="/static/js/app.js?v=2"></script>
  <script>
    // Theme toggle (available before module loads)
    document.getElementById('theme-toggle-btn')?.addEventListener('click', () => {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      const icon = document.getElementById('theme-icon');
      if (icon) icon.innerHTML = next === 'dark' ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      if (window.AppState) window.AppState.theme = next;
    });

    // Mobile sidebar
    document.getElementById('mobile-sidebar-btn')?.addEventListener('click', () => {
      import('/static/js/components/sidebar.js').then(m => m.openMobileSidebar());
    });

    // Show mobile button on small screens
    if (window.innerWidth <= 768) {
      document.getElementById('mobile-sidebar-btn').style.display = 'flex';
    }

    // Model selector init (after app module loads)
    window.addEventListener('load', () => {
      setTimeout(() => {
        const container = document.getElementById('model-selector-container');
        if (container) {
          import('/static/js/components/modelSelector.js').then(m => {
            m.renderModelSelector(container);
          });
        }
      }, 500);
    });

    // Page breadcrumb update
    const origNavigate = window.navigateTo;
    window.navigateTo = function(page, options) {
      const names = {
        home: 'Dashboard', chat: 'Chat', agents: 'Agents',
        history: 'History', settings: 'Settings'
      };
      const crumb = document.getElementById('page-breadcrumb');
      if (crumb) crumb.textContent = names[page] || page;
      if (origNavigate) origNavigate(page, options);
    };
  </script>

</body>
</html>
